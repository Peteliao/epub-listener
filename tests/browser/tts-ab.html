<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>山岚 A/B 评测台</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 24px; max-width: 980px; }
    h1 { font-size: 20px; }
    pre { background: #f5f5f5; padding: 12px; overflow: auto; max-height: 360px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    audio { width: 320px; }
    button, select { padding: 6px 10px; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>山岚 A/B 评测台（仅开发环境）</h1>
  <p class="muted">自动跑参数网格并采集客观指标；下方提供同一句话的 A/B 盲听与打分。</p>
  <pre id="status">准备中…</pre>

  <div class="row" id="listen" hidden>
    <label>A <select id="a"></select></label>
    <label>B <select id="b"></select></label>
    <button id="scoreA">A 更好</button>
    <button id="scoreTie">平手</button>
    <button id="scoreB">B 更好</button>
    <button id="export">导出评分</button>
  </div>
  <div class="row" id="players" hidden>
    <audio id="audioA" controls></audio>
    <audio id="audioB" controls></audio>
  </div>
  <pre id="scores"></pre>
  <pre id="out"></pre>
  <script type="module" src="./tts-ab.js"></script>
</body>
</html>
